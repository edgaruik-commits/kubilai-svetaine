<!DOCTYPE html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Užsakymo JSON iš laiško</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;color:#2a2420}textarea{width:100%;height:260px;font:13px monospace;padding:10px;box-sizing:border-box}button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:6px;background:#d98a1c;cursor:pointer;margin:10px 10px 0 0}#msg{margin-top:12px}.err{color:#b00020}pre{background:#fff;border:1px solid #ddd;padding:10px;overflow:auto;max-height:260px}</style></head><body>
<h1>Užsakymo JSON iš laiško</h1>
<p>Gmail laiške nukopijuok visą lentelę (arba tik <b>order_json</b> reikšmę), įklijuok čia ir spausk „Sukurti failą“.</p>
<textarea id="in" placeholder="Įklijuok laišką..."></textarea><br>
<button id="go">Sukurti failą</button><div id="msg"></div><pre id="pv" hidden></pre>
<script>
document.getElementById('go').onclick=()=>{
 const t=document.getElementById('in').value,m=document.getElementById('msg'),pv=document.getElementById('pv');
 pv.hidden=true;m.className='';
 let a=t.indexOf('{'),b=t.lastIndexOf('}'),o=null;
 /* ieškome tokio { ... }, kuris yra užsakymo JSON */
 while(a!==-1&&!o){
  for(let e=b;e>a;e=t.lastIndexOf('}',e-1)){try{const j=JSON.parse(t.slice(a,e+1));if(j&&j.order_id){o=j;break;}}catch(x){}}
  if(!o)a=t.indexOf('{',a+1);
 }
 if(!o){m.className='err';m.textContent='Užsakymo JSON nerastas. Įsitikink, kad nukopijavai laišką su order_json lauku.';return;}
 const txt=JSON.stringify(o,null,2),url=URL.createObjectURL(new Blob([txt],{type:'application/json'})),l=document.createElement('a');
 l.href=url;l.download='order-'+o.order_id+'.json';document.body.appendChild(l);l.click();l.remove();
 m.textContent='Failas atsisiųstas: order-'+o.order_id+'.json';pv.textContent=txt;pv.hidden=false;
};
</script></body></html>
